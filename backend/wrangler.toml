name = "wakesync-gateway"
main = "src/index.ts"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

# Variables públicas / no secretas (disponibles en el entorno 'env')
[vars]
DEEPSEEK_MODEL = "deepseek-flash"

# NOTA DE SEGURIDAD (RNF-BE-02 / Apéndice F del SRS):
# Los siguientes secretos NUNCA van en este archivo ni en el repositorio Git.
# Se configuran en Cloudflare únicamente a través de la CLI de Wrangler:
#   npx wrangler secret put MAPBOX_ACCESS_TOKEN
#   npx wrangler secret put DEEPSEEK_API_KEY
#   npx wrangler secret put APP_TOKEN
